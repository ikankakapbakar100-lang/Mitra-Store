    <script>
      (function() {
        // 1. Mock Vite HMR WebSocket so that in iframe development mode it opens cleanly without errors
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          class ViteHMRSocket extends EventTarget {
            constructor() {
              super();
              this.readyState = 1;
              this.OPEN = 1;
              this.CONNECTING = 0;
              this.CLOSING = 2;
              this.CLOSED = 3;
              setTimeout(() => {
                this.dispatchEvent(new Event('open'));
              }, 0);
            }
            send() {}
            close() {
              this.readyState = 3;
              this.dispatchEvent(new Event('close'));
            }
          }

          function ViteSafeWebSocket(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=')))) {
              return new ViteHMRSocket();
            }
            return new RealWebSocket(url, protocols);
          }
          ViteSafeWebSocket.prototype = RealWebSocket.prototype;
          ViteSafeWebSocket.CONNECTING = 0;
          ViteSafeWebSocket.OPEN = 1;
          ViteSafeWebSocket.CLOSING = 2;
          ViteSafeWebSocket.CLOSED = 3;
          window.WebSocket = ViteSafeWebSocket;
        }

        // 2. Filter out console.error and unhandledrejection for WebSocket disconnect in iframe
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var isWsError = args.some(function(arg) {
            var str = String(arg && arg.message ? arg.message : arg);
            return str.indexOf('WebSocket closed without opened') !== -1 || str.indexOf('[vite] failed to connect to websocket') !== -1;
          });
          if (isWsError) return;
          origConsoleError.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason) {
            var msg = String(e.reason.message || e.reason);
            if (msg.indexOf('WebSocket') !== -1) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
